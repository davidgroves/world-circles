<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UK Circles</title>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <aside id="controls" aria-label="Circle controls">
        <h1>UK Circles</h1>
        <p class="hint">Click the map to set the centre.</p>
        <label class="control">
          <span class="control-label">
            Spacing
            <output id="spacing-value" for="spacing">1.0 km</output>
          </span>
          <input
            id="spacing"
            type="range"
            min="100"
            max="50000"
            step="100"
            value="1000"
          />
        </label>
        <label class="control">
          <span class="control-label">
            Circles
            <output id="count-value" for="count">5</output>
          </span>
          <input id="count" type="range" min="1" max="20" step="1" value="5" />
        </label>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
